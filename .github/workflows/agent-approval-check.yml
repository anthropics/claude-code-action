# Require a human approval on PRs that contain agent-authored commits.
#
# Both triggers run the workflow file from the BASE/DEFAULT branch, so a PR
# cannot edit this check to approve itself. (`pull_request_review` is not
# used because it runs from the merge ref, not the default branch; native
# Approve reviews are picked up on the next synchronize or `/approve`
# comment.)
#
# required_approvals is 1, not the action's default of 2, because this repo
# has a single maintainer: GitHub does not let you Approve your own PR, so
# the author vouches via `/approve <head-sha>`, which counts as exactly one.
# At 2 an agent-authored PR here could never go green. Raise it to 2 as soon
# as a second person with write access can review.
#
# Still to do in repo settings — this workflow alone gates nothing: mark
# `agent-approval-check` as a required status check on `main`, require at
# least 1 approving review, and enable "Dismiss stale pull request approvals
# when new commits are pushed".

name: agent-approval-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  check:
    # issue_comment also fires on plain issues; skip those early.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full-length SHA: this repo rejects tag/branch action refs
      # ("all actions must be pinned to a full-length commit SHA"), so @main
      # or @v1 fails at action-resolution time before any step runs. This is
      # this repo's own copy of the action, at the current main. Bump the SHA
      # to pick up changes to agent-approval-check/.
      - uses: Yanisleomoser/claude-code-action/agent-approval-check@e8fb0d80642143db8f1261e9a62781862efe72d2
        with:
          required_approvals: 1
          # Claude Code commits land with this committer email; the check
          # reads commit.committer.email, not the Co-authored-by trailer.
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
