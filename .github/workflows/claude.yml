name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # In this repository Claude doesn't run on fork PRs, whatever triggers it. The event for a comment
  # on a PR's conversation doesn't say where the PR's branch is, so this job asks GitHub. If it can't
  # tell, Claude doesn't run.
  fork-check:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run-claude: ${{ steps.check.outputs.run-claude }}
    steps:
      - name: Check that a pull request is not from a fork
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on an issue
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
        run: |
          same_repo=true
          if [ -n "$PR_NUMBER" ]; then
            for attempt in 1 2 3; do
              same_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.id == .base.repo.id') && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 5
            done
          fi
          if [ "$same_repo" = true ]; then
            echo "run-claude=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Claude does not run on pull requests from forks in this repository."
          fi

  claude:
    needs: fork-check
    if: needs.fork-check.outputs.run-claude == 'true'
    # This job calls Claude, so it runs on GitHub's egress-firewall runner, which
    # filters the job's outbound network traffic (allow list: .github/egress-firewall.yaml).
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Lets Claude read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@main
        with:
          # Authenticate to the Claude API via Workload Identity Federation
          # (the workflow's OIDC token is exchanged for a short-lived access
          # token) instead of a static API key. See docs/setup.md.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # --permission-mode auto: a tool call that needs permission and that the allowed tools
          # do not cover runs only if Claude Code's safety review passes it. This is also the
          # action's default, and it is set here so that the workflow hardening check can see it.
          # No --allowedTools, because a rule there skips the review: bun test runs whatever the workspace holds.
          # --disallowedTools: of the CI tools that actions: read enables, Claude needs only the run results. A pull
          # request controls the text of logs and of job and step names.
          # --append-system-prompt: how to use those results where commands are denied.
          claude_args: |
            --disallowedTools "mcp__github_ci__download_job_log,mcp__github_ci__get_workflow_run_details"
            --append-system-prompt "A safety review decides whether a command such as bun test may run, and the action denies such commands on pull requests whose author is not confirmed to have write access. If one is denied, do not try the others or ask for changes to allowedTools. On an issue, say what you could not run. On a pull request, call mcp__github_ci__get_ci_status and report the newest run named CI, which is ci.yml. Only a success conclusion means it passed. action_required means a maintainer has not approved it yet, and a run without a conclusion has not finished. Say that the result is for the latest commit of the pull request and not for edits you made, and that the pull request can change its own workflows, so a maintainer should check the run."
            --model "claude-opus-4-7"
            --permission-mode auto
