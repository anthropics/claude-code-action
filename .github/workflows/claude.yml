name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # Without the federation variables the action exits with "Environment
      # variable validation failed". Someone who wrote @claude then sees a red
      # X and has to open the log to learn why. A notice says it directly.
      # The `vars` context is unavailable in a job-level `if`, but works here.
      HAS_CLAUDE_AUTH: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' && vars.ANTHROPIC_ORGANIZATION_ID != '' }}
    steps:
      - name: Note — Claude API credentials not configured
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: |
          echo "::notice title=Claude is not configured::ANTHROPIC_FEDERATION_RULE_ID and ANTHROPIC_ORGANIZATION_ID are not set as repository variables, so there is no way to reach the Claude API. Set them under Settings > Secrets and variables > Actions and @claude starts responding."

      - name: Checkout repository
        if: env.HAS_CLAUDE_AUTH == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        if: env.HAS_CLAUDE_AUTH == 'true'
        # This fork's own action, SHA-pinned: the repo rejects tag/branch
        # refs, and a fork should dogfood its own code rather than upstream's.
        # Bump this SHA after merging changes to the action itself.
        uses: Yanisleomoser/claude-code-action@7827a6bdc7c599a2c05460346c6f17dd75799752
        with:
          # Authenticate to the Claude API via Workload Identity Federation
          # (the workflow's OIDC token is exchanged for a short-lived access
          # token) instead of a static API key. See docs/setup.md.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: |
            --allowedTools "Bash(bun install),Bash(bun test:*),Bash(bun run format),Bash(bun typecheck)"
            --model "claude-opus-4-7"
