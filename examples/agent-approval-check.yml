# Require human approvals on PRs that contain agent-authored commits.
#
# All three triggers run the workflow file from the BASE/DEFAULT branch, so a
# PR cannot edit this check to approve itself. `pull_request_review` is not
# used here because it runs from the merge ref, not the default branch. Copy
# agent-approval-check-review-signal.yml as well: it runs on each review, and
# the `workflow_run` trigger below re-evaluates the PR when it completes.
#
# After adding this workflow, mark `agent-approval-check` as a required
# status check on your protected branches.

name: agent-approval-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [agent-approval-check-review-signal]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  check:
    # issue_comment also fires on plain issues; skip those early.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action/agent-approval-check@main
        with:
          required_approvals: 2
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
          # Uncomment to tune:
          # excluded_approvers: dependabot[bot]
          # exempt_path_prefixes: docs/
          # protected_bases: main,release
          # status_context_per_base: true
